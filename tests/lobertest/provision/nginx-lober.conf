# Lober nginx 配置 —— VM-S 测试床实测版，渡自 deploy/nginx/lober.conf。
#
# 与生产模板的偏离（都是「单网卡测试 VM」这个前提逼出来的，不是设计倒退）：
#
# 1. 这台 VM-S 只有一个网卡 enp0s2（SLIRP 网段 10.10.10.0/24，guest 固定
#    10.10.10.10），没有生产环境假设的「装机 VLAN 网卡 + 管理网网卡」两张
#    独立网卡。机器面与人面因此共享同一个 IP，靠端口而不是 IP 区分——
#    这仍然满足「listen 写具体 IP，不是 0.0.0.0」这条硬约束，只是两个
#    server 块的具体 IP 恰好相同。
#
# 2. 人面改成明文 HTTP（模板默认 HTTPS + 自建 CA）。理由：
#    a) 上一轮 vmlab 时代的证书把人面 listen 写成了 127.0.0.1:443——这个
#       地址是 guest 内部回环，QEMU 的 SLIRP hostfwd 没法转发到 guest
#       自己的 127.0.0.1，从 Windows 宿主天然连不到，是一个从未真正
#       工作过的配置。
#    b) 测试客户端（Python requests）验证自签 CA 证书链会引入额外的
#       CA 分发/信任步骤，对一次性测试 VM 收益不成比例——deploy/ca/ 的
#       完整 CA 流程是为真实运维场景设计的，这里不复用。
#    人面 HTTPS 本身的安全论证（docs/tls-与安全启动-范围决定.md）不受
#    影响：那份文档论证的是"要不要上 TLS"，本文件的偏离只是"测试床
#    不实践这个可选加固"，机器面永久明文这条结论未变。
#
# 3. 机器面 gateway_base 用 IP 而不是域名。理由：这台 VM-S 没有对外 DNS，
#    Windows 宿主也不会给它做 hosts 映射（"下一个人重建这台 VM 不需要先
#    改宿主机 hosts 文件"这条比"跟生产一致用域名"更值得优先）。SPEC §1.3
#    「用域名不用 IP」的理由是「为将来签证书 CN 对齐留余地」——机器面本
#    来就不签证书（决定 2），这条理由对机器面不适用。
#
# 4. 代理目标端口改成 127.0.0.1:8180 / 127.0.0.1:8190（不是模板占位的
#    8080/8081）。这两个端口是 lobertest/deploy.py 的 render_config 已经
#    在用的值（任务 5 定的，不是本次新增），本文件只是跟着对齐，不是
#    独立决定。
#
# 5. 保留全部六项必须配对（gzip 关闭/Accept-Ranges/open_file_cache/SSE
#    不缓冲等）与两个限流桶——这些与网络拓扑无关，测试床与生产同样适用，
#    是本次唯一原样保留、逐字抄自模板的部分。
#
# 部署前必跑的校验命令（已在 VM-S 上实测跑过，见 provision.md）：
#   sudo nginx -t

# ══════════════════════════════════════════════════════════════════
# 机器面：明文 HTTP，10.10.10.10:80
# ══════════════════════════════════════════════════════════════════
server {
    listen 10.10.10.10:80;
    server_name _;

    access_log /var/log/nginx/lober-boot.log boot;

    location /artifacts/ {
        alias /srv/lober/artifacts/;

        sendfile on;
        aio threads;
        tcp_nopush on;
        gzip off;
        add_header Accept-Ranges bytes;
        # 制品下载刻意不限流——见 deploy/nginx/lober.conf 同位置注释
        # （e8940b0 的教训：套上引导端点限流桶后 334 个包只装进去 41 个）。
    }

    location /artifacts/secure/ {
        alias /srv/lober/artifacts/;
        secure_link $arg_md5,$arg_expires;
        secure_link_md5 "$secure_link_expires$uri$remote_addr lobertest-secure-link-unused";
        if ($secure_link = "")  { return 403; }
        if ($secure_link = "0") { return 410; }

        sendfile on;
        aio threads;
        tcp_nopush on;
        gzip off;
        add_header Accept-Ranges bytes;
    }

    location /repo/ {
        alias /srv/lober/repo/;

        open_file_cache max=20000 inactive=5m;
        open_file_cache_valid 60s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;

        gzip off;
        autoindex on;
    }

    location /v1/signal/ {
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;

        limit_req zone=lober_signal burst=40 nodelay;
    }

    location / {
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        client_max_body_size 64m;

        limit_req zone=lober_boot burst=20 nodelay;
    }
}

# ══════════════════════════════════════════════════════════════════
# 人面：明文 HTTP，10.10.10.10:8090（偏离决定 2：测试床不上 TLS）
# ══════════════════════════════════════════════════════════════════
server {
    listen 10.10.10.10:8090;
    server_name _;

    access_log /var/log/nginx/lober-console.log combined;

    location / {
        proxy_pass http://127.0.0.1:8190;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;

        gzip on;
        gzip_types application/javascript text/css application/json;
    }

    location ~ ^/console/v1/tasks/[^/]+/stream$ {
        proxy_pass http://127.0.0.1:8190;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
