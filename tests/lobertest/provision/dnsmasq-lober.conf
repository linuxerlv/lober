# dnsmasq 配置 —— VM-S 测试床实测版，渡自 deploy/dnsmasq/lober.conf。
#
# 与生产模板的根本偏离：本文件不提供真实的 PXE/DHCP/TFTP 服务。
#
# 生产模板管的是「装机 VLAN」——一张独立网卡，dnsmasq 在这张网卡上做
# DHCP（含五条架构匹配规则）+ TFTP + 本地 DNS，服务的是等待装机的裸机。
# 这台 VM-S 只有一张网卡 enp0s2（QEMU SLIRP 网段 10.10.10.0/24），装机
# VLAN 根本不存在——没有第二张网卡，也没有任何裸机会在这个网段上发
# DHCP DISCOVER。起真实目标机、验证 PXE 引导链路是任务 9（L2 装机层）的
# 范围，不是本次 provision 的目标（本次只搭 VM-S，不起目标机）。
#
# 因此本文件只做一件事：让 dnsmasq 服务本身能干净启动（systemctl
# is-active 为 active），不服务任何 DHCP/TFTP 请求。用 `port=0` 关闭
# dnsmasq 内置的 DNS 应答（避免与 systemd-resolved 或其它已有 DNS 服务
# 冲突），且完全不声明 dhcp-range——没有地址池，dnsmasq 就不会尝试接管
# 这张网卡上的 DHCP 职责（那个职责已经由 QEMU SLIRP 自己的 DHCP 服务
# 承担，guest 的 10.10.10.10 地址正是从那里来的；若本文件也在 enp0s2 上
# 发 DHCP，会与 SLIRP 抢答，guest 网络反而不稳定）。
#
# 下一个人若要在这台 VM-S 上验证真实 PXE 链路：那意味着要给 QEMU 加第二
# 张网卡（socket 类型，接到装机 VLAN），并把这个文件换回生产模板渡出的
# 完整版本（填真实的 PXE_VLAN_IFACE/SUBNET/GATEWAY_DOMAIN 等占位符）。
# 那是任务 9 的工作范围，本文件不是那份工作的半成品，是当前范围下的
# 有意简化。
#
# 部署前必跑的校验命令（已在 VM-S 上实测跑过，见 provision.md）：
#   sudo dnsmasq --test --conf-file=/etc/dnsmasq.d/lober.conf

interface=enp0s2
bind-interfaces
except-interface=lo

# 关闭 DNS 应答：本文件的唯一目的是让服务干净启动，不是提供可用的本地
# DNS。guest 已有可用的 DNS 解析（cloud-init 配置的 resolver），不需要
# dnsmasq 介入。
port=0

# 不声明 dhcp-range、不声明 dhcp-boot、不声明 enable-tftp——装机 VLAN
# 不存在，这些指令没有对象可服务。上面文件头注释已说明为什么。

log-dhcp
