# 部署前必跑的校验命令（本机若有 systemd）：
#   systemd-analyze verify /etc/systemd/system/nginx.service.d/after-lober.conf
# Windows 开发机没有 systemd，这条在这里跑不了，需在目标主机补做
#（见 M9 任务 8 返回值 verifyOutcome 的说明）。
#
# 部署位置：/etc/systemd/system/nginx.service.d/after-lober.conf
#（systemd drop-in 目录名必须是 "<unit名>.service.d"，文件名任意但建议
#  保留 .conf 后缀；本文件路径本身即部署路径，复制过去即可，不需要改名）。
#
# 依据：SPEC.md §1.6「反向代理引入的两个陷阱」第二条——
#   nginx 先起会返回 502。systemd 中给 nginx 加 After=lober.service，
#   或接受重启窗口内的 502（iPXE 会重试，实际影响小）——两种都可接受，
#   但要选一个而不是不管。
#
# 本文件选择的方案：加 After=lober.service 与 Wants=lober.service
# 强制启动顺序，而不是接受重启窗口内的 502。理由：
#
#   1. 本系统的机器面端点面向气隙环境里的裸机 PXE 客户端，重启窗口内的
#      502 虽然「iPXE 会重试、实际影响小」，但重试行为依赖 iPXE 脚本本身
#      的重试逻辑是否配置了退避与次数上限（deploy/ipxe 的构建产物）——
#      这是另一个模块的产出，本文件写作时无法确认其重试策略，因此不把
#      「影响小」当作默认成立的前提。
#   2. 加 After= 的成本几乎为零（一行配置），收益是消除一整类「重启后
#      短暂看起来像故障」的噪音——运维在滚动升级或故障恢复期间不需要
#      分辨「这个 502 是预期的顺序窗口」还是「真的挂了」。
#   3. 代价：nginx 的启动现在依赖 lober.service 先决成功。若 lober.service
#      本身卡在 ExecStartPre 校验失败，nginx 也会被顺序阻塞——这是可接受
#      的，因为 lober 没起来时 nginx 起来也没有意义（反代目标不存在）。
#
# 用 Wants= 不用 Requires=：Wants= 只是"启动 nginx 时顺便尝试启动
# lober.service"，lober.service 启动失败不会连带让 nginx 启动失败；
# Requires= 则会。nginx 不应因 lober.service 停止或失败而被一并拉停——
# nginx 还服务着静态制品与人面前端资源的其它部分，two listener 里网关
# 那部分失败不代表整个反代该下线。若需要「lober 挂了 nginx 也该挂」的
# 强绑定语义，改用 BindsTo=，但本次评审认为不需要这么强。
#
# 只有 After= 没有 Wants=/Requires=/BindsTo= 之一的话，nginx.service 与
# lober.service 之间只有顺序约束、没有拉起关系——如果没有别的地方显式
# enable/start lober.service，nginx 会在 lober 完全不存在的情况下正常
# 启动，直接进入持续 502 而不是"重启窗口内"的短暂 502，这正是本文件要
# 避免的两种后果之一。加 Wants= 让 systemctl start nginx（或开机默认
# target 拉起 nginx 时）一并尝试拉起 lober.service。
[Unit]
After=lober.service
Wants=lober.service
