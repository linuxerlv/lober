#     依赖 iPXE 重新编译带 crypto 并用 TRUST= 嵌内网 CA，这条路径已放弃
#     （不是推迟）。机器面 server 块保持纯明文，见上方该 server 块顶部
#     的说明注释。
#   - 「先编译带 crypto 的 iPXE，后收紧 nginx 配置」的两步走提示——
#     iPXE 完全不再涉及 TLS，这个提示不再适用。
#   - 把 dnsmasq 阶段二 `http://` 改成 `https://` 的启用步骤——机器面
#     与网关之间保持 HTTP，dnsmasq 侧那一行不需要也不应该改。
#   - 把 `gateway_base` / `artifact_base` 改成 https:// 的启用步骤——
#     这两个基址是机器面用的，机器面保持 HTTP，这两个配置项不动。
