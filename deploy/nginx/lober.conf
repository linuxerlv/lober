# ══════════════════════════════════════════════════════════════════
# 人面 TLS（客户端是运维浏览器，只开较新版本，可选叠加重定向与 mTLS）
# ══════════════════════════════════════════════════════════════════
# server {
#     listen __MANAGEMENT_NET_IP__:443 ssl;
#     server_name console.lober.internal;   # 占位：必须与证书 CN/SAN 一致
#
#     # 占位：换成 deploy/ca/issue-cert.sh 签发的人面服务端证书路径
#     ssl_certificate     __TLS_CERT_DIR__/console.lober.internal.cert.pem;
#     ssl_certificate_key __TLS_CERT_DIR__/console.lober.internal.key.pem;
#
#     # 客户端是运维浏览器，可控，只开较新版本（计划任务 3 表格：人面可以
#     # 只开较新的 TLS 版本，不必兼顾 iPXE 的老旧 crypto 支持）。
#     ssl_protocols TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;
