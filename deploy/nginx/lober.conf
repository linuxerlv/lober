# Lober nginx 主配置 —— 三个 server 块：机器面（明文 HTTP）、人面（HTTPS）、
# 人面 HTTP→HTTPS 重定向。SPEC §1.4、§1.6；人面 HTTPS 的范围决定见
# docs/tls-与安全启动-范围决定.md。
#
# 部署前必跑的校验命令（本机 Windows 无 nginx，需在目标 Linux 主机执行）：
#   nginx -t
#   nginx -V 2>&1 | grep -- '--with-threads'                      # sendfile+aio 需要
#   nginx -V 2>&1 | grep -- '--with-http_secure_link_module'      # Phase 2 制品授权需要，MVP 缺它不影响
#   离线环境的发行版 nginx 包若缺这两个编译选项，进了内网无法补装，必须在
#   离线装包前确认（部署期一次性核对项，见 deploy/README.md）。
#
# ── 前置：本文件依赖 lober-http-snippet.conf 先被 include ──
# limit_req_zone 只能声明在 http{} 层。本文件 server{} 块里的 limit_req 指令
# 引用了 lober_boot / lober_signal 两个 zone，这两个 zone 声明在
# deploy/nginx/lober-http-snippet.conf 里。若该文件没有先被 include，
# `nginx -t` 会报 "limit_req_zone \"lober_boot\" is not found"。
# include 顺序与位置要求见 lober-http-snippet.conf 文件顶部注释。
#
# ── 部署前必须替换的占位值（全部搜索关键字 __占位__） ──
#   __MACHINE_VLAN_IP__      机器面 listen 的具体 IP（装机 VLAN 上本机地址）
#   __MANAGEMENT_NET_IP__    人面 listen 的具体 IP（管理网上本机地址）
#   boot.lober.internal      机器面 server_name，占位域名，需改成实际域名
#   console.lober.internal   人面 server_name，占位域名，需改成实际域名
#   __SECURE_LINK_SECRET__   /artifacts/secure/ location 的 secure_link_md5
#                            密钥（Phase 2 制品授权，默认关闭），必须与
#                            gateway.secure_link_secret（internal/config）
#                            逐字节相同——仅当 gateway.secure_link_enabled
#                            打开时才需要替换，MVP 默认关闭状态下这个
#                            location 不会被机器面菜单引用
# 下面两项不是本文件内容，但与本文件强相关，必须同步核对：
#   - Go 侧 gateway.listen / console.listen（internal/config）应绑回环
#     （如 127.0.0.1:8080 / 127.0.0.1:8081），由 nginx 做唯一入口（SPEC §1.4）
#   - /srv/lober/ 下的制品实际路径必须与 docs/contracts/filesystem.md 逐字符一致，
#     否则表现为「引导时 404」（SPEC §10 运维点一）

# ══════════════════════════════════════════════════════════════════
# 机器面：只监听装机 VLAN 的具体 IP
# ══════════════════════════════════════════════════════════════════
#
# 六项必须配对之一（第 1 项）：listen 写具体 IP，不是 0.0.0.0。
# 写成通配时一切功能正常、测试全过，只是装机 VLAN 上的裸机获得了访问控制台
# API 的能力 —— 信任域被静默合并（SPEC §1.4 第 1 点）。
# 加防火墙规则兜底：即便本文件配置正确，仍应在主机防火墙层再加一条规则
# 拒绝管理网 IP 段访问机器面端口，作纵深防御的第二层（config.go 的
# Validate 已经校验 Go 侧不接受通配监听地址，这里的 nginx listen 是独立的
# 第二道防线，两者都要对才算信任域真正隔离）。
#
# ── 本 server 块刻意保持明文 HTTP，这是终局决定，不是待办项 ──
# 2026-09 范围决定：TLS 全量方案（机器面 TLS + mTLS）与 Secure Boot 已放弃，
# 机器面永久保持明文。理由与安全论证见
# docs/tls-与安全启动-范围决定.md（新建于本次改动，接手人先看这份）。
# 一句话摘要：机器面的防线在协议层（§9.1 三道闸门 + token），与 scheme
# 无关；上 TLS 的成本集中在 iPXE 重新编译（本次决定明确放弃，不再重编），
# 换来的保护在装机 VLAN 真正隔离的前提下不成比例。**因此不要在这个 server
# 块上叠加任何 TLS 相关改动**——本文件下方原有的「机器面 TLS」备选段已被
# 移除，只保留人面（管理网）的 HTTPS 备选段。
server {
    listen __MACHINE_VLAN_IP__:80;    # 占位：改成装机 VLAN 上本机的具体 IP
    server_name boot.lober.internal;  # 占位：改成实际域名（SPEC §1.3：用域名不用 IP，为将来签证书 CN 对齐留余地）

    # access log 带上 query 与耗时（两处 SPEC 骨架之外要加的第二项，
    # SPEC §1.4、§10 运维点一）。boot 格式声明在 lober-http-snippet.conf
    # （log_format 同 limit_req_zone 一样只能在 http{} 层声明），随该文件
    # 先于本文件被 include；若看到 nginx -t 报
    # "log_format \"boot\" is not defined"，先检查 include 顺序。
    access_log /var/log/nginx/lober-boot.log boot;

    # ── 制品：/artifacts/ ──
    # 六项必须配对之二：制品走 location 直接发盘，不得 proxy_pass。
    # 否则 4 GB 镜像流经 Go 进程，sendfile 零拷贝、aio threads、Range 请求
    # 全部失效（SPEC §1.4 第 2 点）。
    # alias 路径必须与 docs/contracts/filesystem.md 的
    # /srv/lober/artifacts/ 逐字符一致——nginx 按路径找文件，Go 按同一套
    # 路径签发 URL，不一致即引导时 404（该文档「三条硬约束」第 1 条）。
    location /artifacts/ {
        alias /srv/lober/artifacts/;

        sendfile on;
        aio threads;          # 需 nginx 编译带 --with-threads，见文件顶部校验命令
        tcp_nopush on;

        # 六项必须配对之三（机器面部分）：制品与引导脚本都要关 gzip，
        # 否则 iPXE 会把压缩字节当内核加载（SPEC §1.4 第 2 点、计划任务 6）。
        gzip off;

        # 六项必须配对之四：制品要开 Accept-Ranges，wimboot 与 WinPE 依赖
        # Range 请求（SPEC §1.4 示例、计划任务 6）。
        add_header Accept-Ranges bytes;

        limit_req zone=lober_boot burst=20 nodelay;
    }

    # ── 大制品授权（Phase 2 项，默认关闭）：/artifacts/secure/ ──
    # SPEC §9.3：大制品（kernel/initrd/镜像/WIM）走 nginx secure_link
    # （HMAC + 过期），Go 只签发 URL、完全不在数据路径上。这是与上面
    # /artifacts/ 完全独立的第二个 location，alias 到同一个物理目录——
    # 不能直接在 /artifacts/ 本身加 secure_link 指令：那样离线仓库
    # （几万个包，见 docs/contracts/filesystem.md「repo 位置说明」，
    # MVP 阶段落在 /srv/lober/artifacts/<id>/repo/ 内部，与 kernel/
    # initrd 共享同一个 alias）与 hook 脚本（/artifacts/hooks/<digest>/
    # script.sh）的请求会因为不带签名一起被 403，直接违反 SPEC §9.3
    # 「离线仓库必须保持开放，签了会让装机在装包阶段整体失败」这条硬性
    # 要求（详见 internal/gateway/siglink.go 文件头注释的完整推导）。
    #
    # 只有 internal/gateway 主动把 URL 前缀从 /artifacts/ 改写成
    # /artifacts/secure/ 并附加 md5/expires 查询参数（config.go 的
    # gateway.secure_link_enabled 打开时才会这样做，默认 false）才会
    # 命中这个 location；机器面菜单里其余 URL（inst.repo=、hook 脚本、
    # 未打开 secure_link 时的 kernel/initrd）仍然走上面开放的
    # /artifacts/ location，行为不变。
    #
    # __SECURE_LINK_SECRET__ 占位符必须替换成与
    # internal/config.Gateway.SecureLinkSecret（deploy/lober.yaml.example
    # 的 gateway.secure_link_secret）逐字节相同的值——两侧但凡有一个
    # 字符不同，HMAC 就对不上，机器取制品即 403（部署期核对项，见
    # docs/real-machine/06-securelink.md）。
    #
    # 部署前必须确认 nginx 编译带 --with-http_secure_link_module（本文件
    # 顶部注释已给出核对命令；docs/real-machine/01-配置语法核对.md 第 5
    # 节记录了 Debian trixie 打包版确认带有此选项的实测结果）——若目标
    # 发行版的 nginx 包缺这个编译选项，本 location 里的 secure_link/
    # secure_link_md5 两条指令会让 `nginx -t` 直接报错，此时应保持
    # gateway.secure_link_enabled 为 false（不使用本 location），运维
    # 需重新编译 nginx 或换用带该模块的发行版包才能启用这项加固。
    location /artifacts/secure/ {
        alias /srv/lober/artifacts/;   # 与上面 /artifacts/ 指向完全相同的物理目录

        secure_link $arg_md5,$arg_expires;
        secure_link_md5 "$secure_link_expires$uri$remote_addr __SECURE_LINK_SECRET__";
        if ($secure_link = "")  { return 403; }
        if ($secure_link = "0") { return 410; }

        sendfile on;
        aio threads;
        tcp_nopush on;
        gzip off;
        add_header Accept-Ranges bytes;

        limit_req zone=lober_boot burst=20 nodelay;
    }

    # ── 离线仓库：/repo/ ──
    # 六项必须配对之五：仓库 location 要开 open_file_cache，离线仓库是
    # 几十万小文件（SPEC §1.4 示例、计划任务 6）。
    #
    # 占位路径说明：docs/contracts/filesystem.md 记录 MVP 阶段仓库实际落在
    # 每个制品集目录内部的 repo/ 子目录下（/srv/lober/artifacts/<id>/repo/），
    # 由 /artifacts/ location 的同一个 alias 一并服务，model.BaseURLs 的
    # RepoURL 与 ArtifactURL 当前实现完全相同（都拼 /artifacts/ 前缀）。
    # 因此 MVP 阶段机器面请求不会真正落到这个独立 /repo/ location——
    # 保留这个 location 是为了 SPEC §1.4 原始骨架里「仓库将来可能挪到独立
    # location」这条预留路径（filesystem.md「repo 位置说明」），并提前把
    # open_file_cache 参数按仓库场景配好。若始终不启用，可整段删除而不影响
    # 当前功能；若启用，需同步把 model.BaseURLs.RepoURL 改为拼 /repo/ 前缀，
    # 并把制品集的 Paths.Repo 改为相对 /srv/lober/repo/ 的路径——这是一次
    # 独立的契约变更，不在本次冻结范围内。
    location /repo/ {
        alias /srv/lober/repo/;   # 占位：MVP 阶段此目录预期为空，见上方说明

        open_file_cache max=20000 inactive=5m;
        open_file_cache_valid 60s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;

        gzip off;
        autoindex on;

        limit_req zone=lober_boot burst=20 nodelay;
    }

    # ── 信号回调：/v1/signal/ ──
    # 两处 SPEC 骨架之外要加的第一项：信号端点单独设限流桶（SPEC §10 运维点
    # 二、计划任务 6）。信号回调量不小（数百台 × 每 30 秒），与引导端点共用
    # 限流桶会让一批机器的信号把另一批机器的引导挤掉。
    # 路径必须与 docs/contracts/http-machine.md 端点 4 逐字符一致：
    #   POST /v1/signal/{task}/{token}/{phase}
    location /v1/signal/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;

        limit_req zone=lober_signal burst=40 nodelay;
    }

    # ── 其余机器面端点：/boot.ipxe、/v1/boot、/v1/answer/、/v1/facts/ ──
    # 走同一个 catch-all，代理到 Go 网关 listener（回环地址，占位见下）。
    # 这些端点内容因机器身份而异（SPEC §1.4「分界线」：因主机而异的走 Go），
    # 不能像制品一样直接发盘。
    location / {
        proxy_pass http://127.0.0.1:8080;   # 占位：需与 Go 侧 gateway.listen 一致
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        client_max_body_size 64m;   # 日志与 inspect 上报（SPEC §1.4 示例）

        limit_req zone=lober_boot burst=20 nodelay;
    }
}

# ══════════════════════════════════════════════════════════════════
# 人面：只监听管理网的具体 IP —— 现在默认启用 HTTPS（2026-09 范围决定）
# ══════════════════════════════════════════════════════════════════
#
# 同第 1 项要求：listen 写具体 IP，不是 0.0.0.0，理由与机器面对称——
# 若人面监听地址写成通配，管理网之外的网络路径（若存在路由）也能访问控制台
# API。同样建议加防火墙规则兜底。
#
# ── 为什么人面上 HTTPS、机器面不上：范围决定见
#    docs/tls-与安全启动-范围决定.md ──
# 一句话：人面的客户端是运维的浏览器，装机端与网关之间不受影响（仍是
# HTTP），HTTPS 只保护浏览器 ↔ 控制台这一段——具体保护的是登录凭据与
# access token 不再明文经过管理网。这一段成本极低：不涉及 iPXE，只是
# nginx 配置变更 + 证书签发（deploy/ca/），Go 侧零改动（前端已是同源
# 相对路径，浏览器自动跟随页面 scheme，见 web/apps/web-ele/.env.production
# 的 VITE_GLOB_API_URL=/console/v1）。
#
# ── 证书签发 ──
# 用 deploy/ca/issue-cert.sh 签发人面域名（console.lober.internal 或你的
# 实际域名）的服务端证书，见 deploy/ca/README.md。机器面域名不需要签——
# 机器面永久保持明文，签给它的证书不会被用到。
#
# ── TLS 协议版本：只开较新版本，理由与机器面不同 ──
# 人面客户端是运维的浏览器（可控），不需要迁就 iPXE 那种有限 crypto 支持
# 的旧客户端（原方案里这条约束是给机器面用的，现在机器面不上 TLS，这条
# 约束对人面完全不适用）。选 TLS 1.2 起而不是只留 1.3：1.2 起是目前对
# "只允许现代协议"这条要求的常见折中——它已经排除了 TLS 1.0/1.1 与全部
# 已知的协议级弱点（BEAST/POODLE 等针对的都是 1.1 及更早版本），同时不
# 排除个别仍在使用较旧但受支持系统组件（如某些内网代理、旧版浏览器内核）
# 的运维终端；若确认管理网内所有运维终端浏览器都已支持 TLS 1.3（现代
# Chrome/Firefox/Edge 默认支持），可以进一步收紧到只留 TLS 1.3——这是
# 部署方可自行决定的加固项，不是本次改动的默认值。
server {
    listen __MANAGEMENT_NET_IP__:443 ssl;
    server_name console.lober.internal;  # 占位：改成实际域名，且必须与证书 CN/SAN 一致

    # 占位：换成 deploy/ca/issue-cert.sh 为人面域名签发的证书路径。
    # !!! 下面两行是明显不可用的占位路径，部署前必须替换，不要直接用 !!!
    ssl_certificate     __TLS_CERT_DIR__/console.lober.internal.cert.pem;
    ssl_certificate_key __TLS_CERT_DIR__/console.lober.internal.key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 人面走标准访问日志格式即可（管理网内部流量，不需要机器面那套取证字段）。
    access_log /var/log/nginx/lober-console.log combined;

    # WebUI 与 API 都在 Go 里（UI 走 go:embed，hash 路由，无需 try_files 兜底，
    # SPEC §1.4 示例注释）。
    location / {
        proxy_pass http://127.0.0.1:8081;   # 占位：需与 Go 侧 console.listen 一致
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;

        # 六项必须配对之三（人面部分）：与机器面相反，人面该压——前端 JS/CSS
        # 走这条 location（SPEC §1.4 第 2 点、计划任务 6）。TLS 不影响这两行：
        # gzip 压缩发生在 nginx 生成响应体的阶段，TLS 加密发生在更外层的
        # 传输阶段，两者互不干扰。
        gzip on;
        gzip_types application/javascript text/css application/json;
    }

    # ── SSE：GET /console/v1/tasks/{id}/stream ──
    # 路径必须与 docs/contracts/http-console.md 端点 24（约定 4）逐字符一致：
    #   GET /console/v1/tasks/{id}/stream
    # {id} 是任意非斜杠字符串（任务 ID），正则里用 [^/]+ 匹配。
    #
    # 六项必须配对之六：SSE 的 location 必须关 proxy_buffering 与
    # proxy_cache、放长读超时。默认缓冲会让装机日志看起来完全冻住
    # （SPEC §1.4 第 3 点、§12.8）。**这三行在 HTTPS 下必须仍然生效**——
    # 已确认 TLS 不影响它们：nginx 的缓冲/缓存行为发生在 proxy_pass 处理
    # 上游响应的阶段，与这个 server 块是否监听 ssl 完全独立，同一份
    # location 配置搬到 443 ssl 的 server 块下语义不变。
    location ~ ^/console/v1/tasks/[^/]+/stream$ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;   # 长连接：任务可能持续数十分钟，读超时不能按普通请求设

        # Go 侧会同时设置这个响应头作为兜底（SPEC §12.8：两层都做，因为
        # nginx 配置是部署期产物，Go 侧响应头是代码产物，后者更容易保证
        # 不被遗漏）——此处 nginx 层显式关闭是第一层。
        # X-Accel-Buffering: no 由 Go 侧响应设置，这里不需要重复 add_header
        # （add_header 只对 nginx 自己生成的响应生效，对 proxy_pass 的上游
        # 响应头不适用；上游已经设置的头会原样透传）。
    }
}

# ── 人面 HTTP → HTTPS 重定向（可选，默认启用）──
# 人面可以做重定向：浏览器跟随 301 的行为是确定的（不同于机器面的 iPXE，
# 见上方机器面 server 块注释）。独立开一个 80 端口 server 块只做重定向，
# 不与上面已经在服务 HTTPS 流量的 443 server 块混在一起。
# 若部署方不希望明文 80 端口在管理网上以任何形式响应（哪怕只是重定向），
# 可以整段删除这个 server 块，改为在防火墙层直接拒绝管理网 80 端口——
# 两种做法都合理，取决于运维习惯。
server {
    listen __MANAGEMENT_NET_IP__:80;
    server_name console.lober.internal;  # 占位：改成实际域名，与上面 443 块一致
    return 301 https://$host$request_uri;
}

# ══════════════════════════════════════════════════════════════════
# 范围说明：人面 HTTPS 已在上方直接启用，机器面永久保持明文
# ══════════════════════════════════════════════════════════════════
#
# 2026-09 范围决定：本文件原有的「两面都上 TLS」备选段（机器面 TLS server
# 块 + 人面 TLS server 块，此前整段注释、默认不启用）已被移除，改为上面
# 人面 server 块直接启用 HTTPS（不再是可选的注释段）。
#
# 被移除的内容与理由：
