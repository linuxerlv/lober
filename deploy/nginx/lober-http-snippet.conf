# Lober nginx http 层片段 —— 限流区声明 + 机器面 access log 格式。
#
# 部署前必跑的校验命令（本机 Windows 无 nginx，需在目标 Linux 主机执行）：
#   nginx -t
#   nginx -V 2>&1 | grep -- '--with-threads'                      # sendfile+aio 需要
#   nginx -V 2>&1 | grep -- '--with-http_secure_link_module'      # Phase 2 制品授权需要，MVP 缺它不影响
#
# ── 为什么单独成一个文件 ──
# limit_req_zone 与 log_format 两条指令都只能出现在 http{} 层，不能写进
# server{}/location{}。本文件必须先被主配置 include，否则：
#   - lober.conf 里引用 lober_boot/lober_signal 的 limit_req 指令会在
#     `nginx -t` 时报 "zone not found"
#   - lober.conf 里 access_log ... boot; 引用的 boot 格式名会报
#     "log_format \"boot\" is not defined"
#
# include 位置要求（二选一，取决于发行版打包方式）：
#   1) 若发行版的 nginx.conf 已有 `include /etc/nginx/conf.d/*.conf;`（http{} 块内），
#      把本文件放进 /etc/nginx/conf.d/ 即可被自动 include，无需手工改 nginx.conf。
#   2) 否则手工在 nginx.conf 的 http{} 块内、server{} 之前加一行：
#        include /etc/nginx/lober-http-snippet.conf;
#      本文件必须排在 lober.conf 的 include 之前（http{} 内指令按 include 顺序生效，
#      zone 声明必须先于引用它的 limit_req 指令被解析）。
#
# ── 两个限流桶为什么要分开（SPEC §10 运维点二）──
# 信号回调量不小（数百台机器 × 每 30 秒一次 heartbeat/signal），若与引导端点
# （/v1/boot、/boot.ipxe、/v1/answer/...）共用一个桶，一批机器高频发信号会把
# 另一批机器的引导请求挤掉限流队列 —— 表现为「装机中的机器信号正常，
# 新开机的机器却卡在 iPXE 菜单迟迟拿不到响应」，且这个现象只在机器数够多、
# 时间点撞上时才出现，测试环境很难复现。

# 引导相关端点：/boot.ipxe、/v1/boot、/v1/answer/...、/v1/facts/...（GET 侧）。
# key 用 $binary_remote_addr（比 $remote_addr 省内存，功能等价）。
# rate 与 burst 是占位起点值，不是压测得出的最终值——见下方说明必须按实际
# 机群规模与并发装机上限（SPEC §10 失败模式 11）调整。
limit_req_zone $binary_remote_addr zone=lober_boot:10m rate=30r/s;

# 信号回调端点：/v1/signal/...、/v1/facts/...（POST 侧）。
# 数百台机器每 30 秒各发一次信号，折算成稳态速率并不高，但要能吸收同一时刻
# 大批机器一起上报的突发（比如整机架同时开机）。
limit_req_zone $binary_remote_addr zone=lober_signal:10m rate=60r/s;

# ── 机器面 access log 格式：带上 query 与耗时 ──
# 两处 SPEC 骨架之外要加的第二项（SPEC §1.4、§10 运维点一，计划任务 6）。
# 格式逐字符取自 SPEC §1.4 原文示例，不额外增删字段。
# nginx access log 是 iPXE 启动之后全链路的主要取证记录：sn/mac/uuid 都在
# $request_uri 里，grep 单机可得完整引导时间线；$body_bytes_sent 与
# $request_time 能直接看出制品传输是否中途断开。只给机器面用（人面走管理网，
# 走标准 combined 格式即可，不需要这些字段）。
log_format boot '$time_iso8601 $remote_addr "$request_uri" $status $body_bytes_sent $request_time';

# ── 占位值必须按部署环境调整 ──
# 上面两个 zone 的 rate/burst（burst 在 lober.conf 的 limit_req 指令里设置）
# 是保守占位值，不是从真实机群压测出的数字。部署前必须按以下两点核实：
#   1. 实际机群规模（装机 VLAN 上同时在线的机器数）
#   2. SPEC §10 失败模式 11 提到的「并发装机上限」——状态机侧的 provisioning
#      并发上限应与这里的限流桶容量互相匹配，避免限流层拒绝了状态机本可
#      接受的合法请求
