# 部署前必跑的校验命令（本机若有 dhcpd）：
#   dhcpd -t -cf deploy/dhcpd/lober.conf
# 光跑通配置测试模式不够——务必再用真机验证两阶段各走对分支
# （非 iPXE 客户端拿架构专属二进制，已是 iPXE 的客户端拿固定 URL），
# 并抓一次 DHCP DISCOVER 报文确认固件实际上报的 option 93 值与本文件
# 判定条件一致。附录 B 明确把这条列为待核实项，不能假设通过配置测试
# 就等于行为正确。
#
# ⚠ 仅在无法使用 dnsmasq 时才用这份配置。
#   判据：目标机房已有在运的 ISC dhcpd 且不接受再引入一个 DHCP 服务。
#   新部署一律选 dnsmasq 或 Kea，不要选 dhcpd——它已于 2022 年 10 月 EOL
#   （最后维护版本 4.4.3-P1 / 4.1-ESV-R16-P2），ISC 官方建议迁移到 Kea。
#   本文件是「对接既有环境」的等价配置，不是推荐方案。
#   完整判据、与 dnsmasq/Kea 的机制对照表见同目录上级 README-既有DHCP.md。
#
# 依据：
#   SPEC.md §1.3（dnsmasq 基线两阶段逻辑）、§1.3.1（本等价配置）
#   docs/superpowers/plans/2026-09-20-lober-mvp-09-integration.md 任务 7b
#
# ============================================================================
# 占位值说明（务必修改，以下均为示例值，不是可直接部署的真值）：
#   10.10.0.0/24、10.10.0.1、10.10.0.100-200  —— 装机 VLAN 的网段与网关，
#     部署时必须与 deploy/dnsmasq/lober.conf、deploy/nginx/lober.conf 里
#     填入的真实网段一致（dnsmasq 版本里这些是 <PXE_VLAN_...> 占位符，
#     本文件直接借用 SPEC.md §1.3 的示例网段，两者部署时要落到同一个真值）
#   boot.lober.internal                       —— 网关域名示例，dnsmasq 版本
#     里对应的是 <GATEWAY_DOMAIN> 占位符，部署时两处要填同一个真实域名，
#     并在既有 DNS（通常与这套 dhcpd 同机房的 DNS 服务）中登记解析到网关 IP
#   undionly.kpxe / snponlyx32.efi / snponly.efi / snp-arm64.efi
#                                              —— iPXE 二进制文件名，
#     必须与 TFTP 根目录（next-server 指向的服务器）下的实际文件名一致
# ============================================================================

# 必须显式声明——dhcpd 没有 client-arch 这个选项名的内置定义，
# 不声明就无法在 if/elsif 里引用 option 93。
option client-arch code 93 = unsigned integer 16;

allow booting;
allow bootp;

# 占位：改成目标机房的真实网段、掩码、地址池、路由器、DNS。
subnet 10.10.0.0 netmask 255.255.255.0 {
    range 10.10.0.100 10.10.0.200;
    option routers 10.10.0.1;
    option domain-name-servers 10.10.0.1;

    # ── 阶段二优先：user-class 判定必须在阶段一（架构判定）之前 ──
    #
    # 硬要求，不是风格选择：dhcpd 没有 tag 机制，两阶段互斥完全依赖
    # elsif 的书写顺序。若把这段挪到架构分支之后，已经跑起 iPXE 的
    # 客户端再次发 DISCOVER 时会先被架构分支截住、又拿到一次 iPXE
    # 二进制而不是引导脚本 URL——直接构成无限引导循环（SPEC §10 失败
    # 模式 3）。这条比 dnsmasq 那边的 tag:!ipxe 更致命，因为 dnsmasq
    # 写反顺序至多是多一层 tag 判断，dhcpd 写反顺序是直接吞掉分支。
    if exists user-class and option user-class = "iPXE" {
        # 无需 next-server：filename 以 http:// 开头时 iPXE 按 URI
        # scheme 直接走 HTTP，不受传统 next-server/TFTP 语义约束
        # （SPEC 附录 A.13，2-1 弱确认，来源见 SPEC.md 附录 A 表）。
        filename "http://boot.lober.internal/boot.ipxe";

    # ── 阶段一：按 option 93 给架构专属二进制 ──
    #
    # 下面四个分支与 deploy/dnsmasq/lober.conf 的 dhcp-match 一一对应，
    # 但字面量写成 00:XX 双字节形式而不是十进制整数——这是社区通行
    # 写法（dhcpd 按原始 option 字节逐字节比较），但本文件顶部的
    # dhcpd -t 校验命令不能替代真机验证：SPEC 附录 B 明确把这条语法
    # 的实际行为列为待核实项，写成 `= 7` 这种十进制形式是否等效，
    # 以及 elsif 条件里的 or 求值是否如预期，都需要在实验环境用
    # dhcpd -t 加真机各验一遍，不能凭空假设。
    } elsif option client-arch = 00:00 {              # X86PC，传统 BIOS
        next-server 10.10.0.1;
        filename "undionly.kpxe";
    } elsif option client-arch = 00:06 {              # IA32 UEFI
        next-server 10.10.0.1;
        filename "snponlyx32.efi";
    } elsif option client-arch = 00:07
         or option client-arch = 00:09 {
        # x64 UEFI —— 7 与 9 必须都匹配，且 7 才是实测主流值。
        # RFC 4578 原文把 7 定义为 EFI BC、9 定义为 EFI x86-64，但该
        # RFC 的勘误明确指出两者应当互换；实际 UEFI 固件用 7 上报
        # x86-64，ipxe.org 将 9 标注为 obsolete。只配 9 的后果是 UEFI
        # 机器匹配不上任何分支、拿不到 filename、固件静默跳到下一个
        # 引导项，现场表现为「机器毫无反应」（与 deploy/dnsmasq 的
        # 双匹配保持一致，见该文件同一段注释）。
        next-server 10.10.0.1;
        filename "snponly.efi";
    } elsif option client-arch = 00:0b {              # ARM64 UEFI（飞腾/鲲鹏等）
        # MVP 阶段可以不在 TFTP 根目录放这个二进制，但分支要留：
        # 留着分支时缺文件会在 TFTP 日志留下一条「文件不存在」的
        # 记录，排查成本比落进下面的未知架构分支低一个数量级。
        next-server 10.10.0.1;
        filename "snp-arm64.efi";

    # ── 未知架构：显式不给 filename，只打日志 ──
    #
    # 不写这个分支时客户端拿不到 filename、固件静默跳过网络引导，
    # 现场表现与「DHCP 没响应」完全一致——这条日志是区分二者的唯一
    # 依据。绝不要在这里兜底发某个二进制：给错架构的二进制会让固件
    # 加载失败或挂死，比不引导更难查（SPEC §10 失败模式 4）。
    } else {
        log(info, concat("lober: unknown client-arch, mac=",
            binary-to-ascii(16, 8, ":", substring(hardware, 1, 6))));
    }
}
