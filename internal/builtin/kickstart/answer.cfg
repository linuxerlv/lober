cmdline
lang en_US.UTF-8
keyboard us
timezone UTC
url --url={{sys:repo}}
{{lober:syslog}}
network --bootproto=dhcp --hostname={{param:hostname}}
rootpw --lock
zerombr
clearpart --all --initlabel
autopart
%packages
@^minimal-environment
{{slot:packages}}
%end
%post --interpreter=/bin/sh
{{lober:firstboot}}
{{lober:cleanup}}
%end
reboot
