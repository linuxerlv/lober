# lober 正文扫描样例：preseed（Debian）
d-i debian-installer/locale string en_US.UTF-8
d-i netcfg/get_hostname string {{param:hostname}}
d-i apt-setup/local0/repository string {{sys:repo}} trixie main
{{slot:分区}}
d-i pkgsel/include string {{param:pkgs|join}}
d-i preseed/early_command string {{slot:装前@pre}}
d-i preseed/late_command string {{slot:装后@post-installer}}; {{lober:firstboot}}; {{lober:cleanup}}
