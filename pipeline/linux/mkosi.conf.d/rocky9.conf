# mkosi 封装定义：Rocky Linux 9 x86_64，镜像直写通道用。
#
# 部署前必跑（本 worktree 未装 mkosi，无法在此环境实测，见 pipeline/README.md 第 6 节）：
#   cd pipeline/linux && mkosi --directory=. summary   # 语法与配置汇总检查
#   cd pipeline/linux && mkosi --directory=. build      # 实际封装，产出到 mkosi.output/
#
# 字段依据：mkosi 官方 man page（systemd/mkosi/mkosi/resources/man/mkosi.1.md）
# 核实的 Distribution= 取值列表，见 pipeline/README.md 第 1 节。选 rocky 对应
# SPEC §11 Phase 1 已选定的发行版（Rocky 9），与已有的 installer 驱动通道用
# 同一个 OS 版本，方便任务 5 做两条通道的对比验证。
#
# 与 SPEC §2.1 的对应：本文件封装出的镜像最终对应一条
# os_family=rhel, os_version=9.4, arch=x86_64, firmware=any 的 ArtifactSet
# （镜像直写通道），firmware=any 是因为 mkosi 的 legacy-free 产物固定用 GPT+EFI，
# 但 rhel 系在 installer 驱动通道本来就是 firmware=any（同一套制品 BIOS/UEFI
# 通吃），这里保持同一约定，不因为封装工具的实现细节改变对外呈现的固件字段。

[Distribution]
Distribution=rocky
Release=9
Architecture=x86-64

[Output]
# raw 格式：不用 mkosi 默认的 disk 输出附带的额外元数据封装，直接产出块设备
# 镜像本体，与 pipeline/README.md 第 2.1 节「不用 qcow2/vmdk」的结论一致。
Format=disk
CompressOutput=no
# 不在这里用 mkosi 内建的压缩（它支持但格式与本项目约定的 zstd 裸压缩不同），
# 压缩这一步统一交给 scripts/package.sh 用系统 zstd 命令做，保证产出的
# image.raw.zst 是「裸 zstd 压缩的 raw 文件」这个单一格式，不掺 mkosi 自己的
# 归档层。

[Content]
# Bootloader=none：镜像直写通道不需要 mkosi 内建的 systemd-boot/grub 安装逻辑
# 生成一个独立可引导的 ESP——分区布局与引导方式由目标机器实际写盘后的固件环境
# 决定，具体的 bootloader 落地属于任务 4（写盘完成后的分区调整/引导修复）的
# 职责范围，本任务只负责产出一个装好基础系统的镜像。
# 若任务 4 的实现确认需要 mkosi 直接产出可自举镜像，此处应改为
# Bootloader=systemd-boot 并在任务 4 侧同步调整——这是一个需要两侧对齐的接缝，
# 已记入 pipeline/README.md openQuestions 第 3 条。
Bootloader=none

# 包列表刻意精简为「能起系统 + 能联网 + 能被 firstboot 脚手架接管」的最小集合，
# 不预先猜测业务需要的软件——SPEC §5.8 的 firstboot 脚手架本身就是为了在装完后
# 再按需定制，镜像本身应该保持通用与可重现（包越少，两次封装的 package_list_sha256
# 越不容易因为上游仓库的间接依赖版本漂移而对不上）。
Packages=
    rocky-release
    kernel
    systemd
    NetworkManager
    openssh-server
    cloud-init
