[project]
name = "gosurgeon"
version = "0.1.0"
description = "对 Go 源码做行级精确编辑，避免转义序列被两层解析"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
gosurgeon = "gosurgeon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gosurgeon"]
