[project]
name = "vmlab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paramiko>=5.0.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
]

[project.scripts]
vmlab = "vmlab:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: 真的起 QEMU 装系统的用例，一次二十分钟到一小时",
]
